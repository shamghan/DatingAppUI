@if(photos$ | async; as photos)
{
    @if(photos.length > 0)
    {
        <div class="grid grid-cols-4 auto-rows-min gap-3 h-[65vh] overflow-auto">
            @for(photo of photos; track photo.id)
            {    
                   <img src="{{photo.url}}" alt="phot of member" class="w-full rounded-lg">
            }
            @for(photo of photoMock; track $index)
            {    
                   <img src="{{photo.url}}" alt="phot of member" class="w-full rounded-lg">
            }
        </div>
    }@else {
        <div class="text-center text-lg text-gray-500">
            No photos available for this member.
        </div>
    }
}
