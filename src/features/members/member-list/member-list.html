<!-- @if(paginatedMembers$ | async; as paginatedResult){ -->
@if(paginatedMembers(); as paginatedResult){
<div class="flex flex-col w-full">
    <div class="flex justify-between items-center">
        <div class="flex gap-3 items-center">
            <button (click)="openModal()" class="btn btn-primary">Select Filter</button>
            <button (click)="resetFilter()" class="btn btn-neutral">Reset Filter</button>
            <div class="text-lg bg-base-100 py-2 px-4 border-1 rounded-lg text-primary capitalize">
                {{displayMessage}}
            </div>
        </div>
        @if(paginatedResult.metaData; as metadata){
        <app-paginator [pageNumber]="metadata.currentPage" [totalCount]="metadata.totalCount"
            [totalPages]="metadata.totalPages" [pageSize]="metadata.pageSize" (pageChange)="onPageChange($event)">
        </app-paginator>
    }
    </div>
    @if(paginatedResult.items; as members){
    <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;">
        @for(member of members; track member.id)
        {
        <app-member-card [member]="member" />
        }
    </div>
    }
</div>
}





<app-filter-modal #filterModal [hidden]="!paginatedMembers()" (closedModal)="onClose()"
    (submitData)="onFilterChange($event)"></app-filter-modal>
