<div class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg">
    <div class="card-title justify-center text-3xl text-primary">Sign up</div>
    <div class="card-body w-full">
        <form #registerForm="ngForm" class="flex flex-col gap-4 w-full" (ngSubmit)="register()">
            <input class="input w-full" name="email" [(ngModel)]="creds.email" placeholder="Email" required>
            <input class="input w-full" name="displayName" [(ngModel)]="creds.displayName" placeholder="Display Name"
                required>
            <input type="password" class="input w-full" name="password" [(ngModel)]="creds.password"
                placeholder="Password" required>
           

            <div class="flex item-center justify-end gap-3">
                <button class="btn"  (click)="cancel()" type="button">Cancel</button>
                <button class="btn btn-primary"  type="submit">Submit</button>
            </div>
        </form>
    </div>
</div>
