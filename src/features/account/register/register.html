<div class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg">
    <div class="card-title justify-center text-3xl text-primary">Sign up</div>
    <div class="card-body w-full">
        <form [formGroup]="registerForm" class="flex flex-col gap-1 w-full" (ngSubmit)="register()">
            <label class="floating-label">
                <span>Email</span>
                <input class="input w-full" formControlName="email" placeholder="Email" required>
            </label>
            <label class="floating-label text-left">
                <span>Display Name</span>
                <input class="input w-full" 
                [class.input-error]="registerForm.controls['displayName'].invalid 
                &&  registerForm.controls['displayName'].touched" 
                formControlName="displayName"
                placeholder="Display Name">

            </label>
            
                @if(registerForm.controls['displayName'].invalid && registerForm.controls['displayName'].touched)
                {
                 <div class="validation-hint text-error text-xs text-left">Display Name is required.</div>
                }
            <label class="floating-label">
                <span>Password</span>
                <input class="input w-full" formControlName="password" placeholder="Password" required>
            </label>
            <label class="floating-label">
                <span>Confirm Password</span>
                <input class="input w-full" formControlName="confirmPassword" placeholder="Confirm Password" required>
            </label>
            <div class="flex item-center justify-end gap-3">
                <button class="btn" (click)="cancel()" type="button">Cancel</button>
                <button class="btn btn-primary" [disabled]="!registerForm.valid" type="submit">Submit</button>
            </div>
        </form>
    </div>
    <div class="flex flex-col items-start w-full px-3 mockup-code text-lg">
        <div>Form Value: {{registerForm.value | json}}</div>
        <div>Form Status: {{registerForm.status | json}}</div>

    </div>
</div>
