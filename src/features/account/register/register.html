<div class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg">
    <div class="card-title justify-center text-3xl text-primary">Sign up</div>
    <div class="card-body w-full">
        <ul class="steps">
            <li class="step step-primary">Credentials</li>
            <li class="step" [class.step-primary]="currentStep() === 2">Profile</li>
        </ul>
        @if(currentStep() === 1){
            <form [formGroup]="credentialsForm" class="flex flex-col gap-1 w-full steps" >
                
                <app-text-input label="Email" class="mt-2" formControlName="email"></app-text-input>
                <app-text-input label="Display name" class="mt-2" formControlName="displayName"></app-text-input>
                <app-text-input label="Password" class="mt-2" formControlName="password" type="password"></app-text-input>
                <app-text-input label="Confrim Password" class="mt-2" formControlName="confirmPassword" type="password"></app-text-input>
                
                <div class="flex item-center justify-end gap-3">
                    <button class="btn" (click)="cancel()" type="button">Cancel</button>
                    <button class="btn btn-primary" [disabled]="!credentialsForm.valid" (click)="nextStep()" type="button">Next</button>
                </div>
            </form>
        }
        @if(currentStep()===2)
        {
            <form [formGroup]="profileForm" class="flex flex-col w-full gap-4 steps">
                <div class="flex items-center gap-4">
                 <div class="font-semibold">Gender:</div>

                <label class="flex items-center gap-2">
                    <input
                        type="radio"
                        formControlName="gender"
                        value="male"
                        class="radio radio-primary"
                    />
                    <span>Male</span>
                </label>

                <label class="flex items-center gap-2">
                    <input
                        type="radio"
                        formControlName="gender"
                        value="female"
                        class="radio radio-primary"
                    />
                    <span>Female</span>
                </label>
            </div>

                <app-text-input [maxDate]="getMaxDate()" type="date"  label="Date of Birth" class="mt-1" formControlName="dateOfBirth"></app-text-input>
                <app-text-input label="City" class="mt-1" formControlName="city" ></app-text-input>
                <app-text-input label="Country" class="mt-1" formControlName="country" ></app-text-input>
                 <div class="flex item-center justify-end gap-3">
                    <button class="btn" (click)="prevStep()" type="button">Back</button>
                    <button class="btn btn-primary" [disabled]="!profileForm.valid" (click)="register()" type="button">Register</button>
                </div>
            </form>
        }
        
    </div>
   @if(validationErrors().length>0){
    <div class="mt-5 flex bg-gray-200 rounded-2xl w-1/2 p-3 mx-auto">
        <ul class="flex flex-col text-error space-y-1">
            @for(error of validationErrors(); track $index){
                <li>{{error}}</li>

            }
        </ul>
    </div>
   }
</div>
